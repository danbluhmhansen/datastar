# https://taskfile.dev
version: "3"
tasks:
  library:
    dir: library
    sources:
      - "**/*.ts"
      - "**/*.js"
      - "**/*.json"
    generates:
      - "dist/**/*"
    cmds:
      - for: ["datastar-aliased.ts", "datastar-core.ts", "datastar.ts"]
        cmd: |
          npx esbuild --bundle src/bundles/{{.ITEM}}  \
          --define:__USE_UPLOAD_PROGRESS__=true \
          --define:ALIAS=null \
          --outdir=../bundles/  \
          --minify --sourcemap \
          --target=es2023 \
          --format=esm
  default:
    deps: [library]
